<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trobuleshooters Compresser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('download.jpeg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
        }
        .background-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(2px);
            z-index: -1;
        }
        .container {
            position: relative;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95); /* Increased opacity */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
        }
        .navbar img {
            height: 40px;
        }
        .navbar .profile {
            display: flex;
            align-items: center;
        }
        .navbar .profile img {
            height: 40px;
            border-radius: 50%;
            margin-left: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .h1{
            text-align: center;
            color: rgb(244, 12, 12);
            box-shadow: #f0f2f4;
            text-decoration: double;
            text-shadow: #0e0f0f;
        }
    </style>
</head>
<body>
    <div class="background-blur"></div>
    <div class="navbar">
        <img src="logo.png" alt="Logo">
        <div class="profile">
            <button>Login</button>
            <img src="profile.png" alt="Profile Image">
        </div>
    </div>
    <h1 style="text-align: center; color: rgb(236, 64, 16);">Trobuleshooters Compresser</h1>
    
    <div class="container">
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="fileType">Select File Type:</label>
                <select name="fileType" id="fileType" required>
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                    <option value="document">Document</option>
                </select>
            </div>
            <div class="form-group">
                <label for="files">Select Files:</label>
                <input type="file" name="file" id="fileInput" multiple required title="Select files to upload">
            </div>
            <button id="downloadButton">Download Compressed File <span class="loading" style="display: none;"></span></button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        const CLOUD_NAME = 'ddy0ut9pz';
        const UPLOAD_PRESET = 'ml_default';

        const getUploadConfig = (fileType) => {
            if (fileType === 'video') {
                return {
                    resourceType: 'video',
                    eager: 'q_auto:eco,f_auto'
                };
            }

            if (fileType === 'image') {
                return {
                    resourceType: 'image',
                    eager: 'c_scale,w_800,q_auto:eco,f_auto'
                };
            }

            return {
                resourceType: 'raw',
                eager: null
            };
        };

        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const fileInput = document.getElementById('fileInput');
            const fileType = document.getElementById('fileType').value;
            const uploadButton = document.querySelector('button[type="submit"]');
            const loadingSpinner = document.querySelector('.loading');

            if (!UPLOAD_PRESET || !CLOUD_NAME) {
                document.getElementById('result').innerHTML = '<p>Error: Missing Cloudinary client configuration.</p>';
                return;
            }

            uploadButton.disabled = true;
            loadingSpinner.style.display = 'inline-block';

            try {
                const { resourceType, eager } = getUploadConfig(fileType);
                const results = [];

                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];
                    const formData = new FormData();

                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);

                    if (eager) {
                        formData.append('eager', eager);
                    }

                    const endpoint = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error && result.error.message ? result.error.message : 'File upload failed');
                    }

                    const originalBytes = file.size;
                    const originalFileSize = (originalBytes / (1024 * 1024)).toFixed(2);
                    const eagerResult = Array.isArray(result.eager) && result.eager.length > 0 ? result.eager[0] : null;
                    const compressedBytes = eagerResult && eagerResult.bytes ? eagerResult.bytes : result.bytes;
                    const compressedFileSize = (compressedBytes / (1024 * 1024)).toFixed(2);
                    const compressionPercentage = originalBytes > 0
                        ? (((originalBytes - compressedBytes) / originalBytes) * 100).toFixed(2)
                        : '0.00';

                    results.push({
                        originalFileSize,
                        compressedFileSize,
                        compressionPercentage,
                        downloadUrl: eagerResult && eagerResult.secure_url ? eagerResult.secure_url : result.secure_url
                    });
                }

                const params = new URLSearchParams(results[0]).toString();
                window.location.href = `/result.html?${params}`;
            } catch (error) {
                console.error('Error during file upload:', error);
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            } finally {
                uploadButton.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
